<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="password" type="password">
</body>

<script>
    let DB
    const DB_NAME = "rtcp2p"
    const DB_VERSION = 1

    function getPassword() {
        return document.getElementById("password").value
    }
    function cleanPassword() {
        document.getElementById("password").value = ""
    }

    function OpenDB() {
        return new Promise((resolve, reject) => {
            const DBOpenRequest = window.indexedDB.open(DB_NAME, DB_VERSION)
            DBOpenRequest.onupgradeneeded = event => {
                DB = event.target.result
                DB.createObjectStore(DB_NAME)
            }
            DBOpenRequest.onsuccess = event => {
                DB = event.target.result
                resolve()
            }
            DBOpenRequest.onerror = (event) => reject(event.target.error)
        })
    }

    function randomBytes(length) {
        return crypto.getRandomValues(new Uint8Array(length));
    }

    async function generateKey(salt) {
        const encoder = new TextEncoder()
        const baseKey = await crypto.subtle.importKey(
            "raw",
            encoder.encode(getPassword()),
            { name: "PBKDF2" },
            false,
            ["deriveKey"]
        )
        const baseKeyAlgorithm = {
            name: "PBKDF2",
            salt: salt,
            iterations: 150000,
            hash: "SHA-256"
        }
        const derivedKeyAlgorithm = { name: "AES-GCM", length: 256 }
        return await crypto.subtle.deriveKey(
            baseKeyAlgorithm,
            baseKey,
            derivedKeyAlgorithm,
            false,
            ["encrypt", "decrypt"]
        )
    }

    async function encrypt(salt, iv, data) {
        const encoder = new TextEncoder()
        return await crypto.subtle.encrypt(
            { name: "AES-GCM", iv },
            await generateKey(salt),
            encoder.encode(data)
        );
    }

    async function decrypt(salt, iv, data) {
        const decoder = new TextDecoder()
        let decrypted
        try {
            decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv },
                await generateKey(salt),
                data
            )
        } catch {
            return // incorrect password
        }
        return decoder.decode(decrypted)
    }

    async function LoadSession() {
        // get salt iv and data from db
        const store = DB.transaction([DB_NAME], "readonly").objectStore(DB_NAME)
        let session
        try {
            session = await new Promise((resolve, reject) => {
                const request = store.get("session")
                request.onsuccess = (event) => {
                    resolve(event.target.result)
                }
                request.onerror = (event) => reject(event.target.error)
            })
        } catch {
            return // session does not exist
        }
        let { salt, iv, data } = session
        data = await decrypt(salt, iv, data)
        cleanPassword()
        return data
    }

    async function SaveSession(data) {
        // encrypt data
        const salt = randomBytes(16)
        const iv = randomBytes(12)
        data = await encrypt(salt, iv, data)

        // store in IndexedDB
        const transaction = DB.transaction([DB_NAME], "readwrite")
        const store = transaction.objectStore(DB_NAME)
        store.put({ salt, iv, data }, "session")
        await new Promise((resolve, reject) => {
            transaction.oncomplete = resolve
            transaction.onerror = (event) => reject(event.target.error)
        })
        cleanPassword()
        return
    }

</script>
</html>
